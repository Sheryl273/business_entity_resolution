# config/model.yaml
# Owner: Person C (Krishna Gupta) — Matching Model
# All training hyperparameters live here. Do NOT hard-code these in source code.

# ─── LightGBM core parameters ─────────────────────────────────────────────────
model:
  type: lightgbm
  objective: binary
  metric: binary_logloss          # internal; we tune on Macro F0.5 externally
  boosting_type: gbdt
  n_estimators: 3000              # generous upper bound; early stopping trims it
  learning_rate: 0.05
  num_leaves: 63                  # 2^depth-ish; 63 suits moderate-depth trees
  max_depth: -1                   # -1 = unconstrained; let num_leaves control
  min_child_samples: 50           # prevents overfitting on tiny leaf partitions
  subsample: 0.8                  # row sub-sampling per tree
  subsample_freq: 1               # frequency of subsampling (every tree)
  colsample_bytree: 0.8           # feature sub-sampling per tree
  reg_alpha: 0.1                  # L1 regularization
  reg_lambda: 1.0                 # L2 regularization
  class_weight: balanced          # auto scale_pos_weight; re-evaluated at runtime
  n_jobs: -1                      # use all available CPU cores
  verbose: -1                     # suppress LightGBM's own chatty output

# ─── Early stopping ───────────────────────────────────────────────────────────
early_stopping:
  rounds: 100                     # stop if val metric doesn't improve in 100 rounds
  verbose: false

# ─── Threshold search ─────────────────────────────────────────────────────────
threshold_search:
  min: 0.05
  max: 0.95
  step: 0.01                      # 91 candidate thresholds — fast enough

# ─── Reproducibility ──────────────────────────────────────────────────────────
seed: 42

# ─── Hard-negative mining (optional second phase) ─────────────────────────────
hard_negative_mining:
  enabled: false
  score_col: predicted_prob       # column used to rank difficult negatives
  top_k_per_entity: 5             # hardest k negatives to keep per S1 entity
  ratio: 1.0                      # neg:pos ratio after mining (1.0 = balanced)
